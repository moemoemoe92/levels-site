<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- SEO -->
    <title>تجربة 3D تفاعلية - مقهى ليفيلز | Interactive 3D Experience</title>
    <meta name="description" content="استمتع بتجربة تفاعلية ثلاثية الأبعاد لكوب القهوة من مقهى ليفيلز. تقنية Three.js المتطورة.">
    <meta name="keywords" content="3D, Three.js, تجربة تفاعلية, قهوة, ليفيلز">

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../favicon.ico">

    <!-- Theme Color -->
    <meta name="theme-color" content="#A27B5C">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <div class="spinner"></div>
        <p>جاري التحميل...</p>
    </div>

    <!-- Back Button -->
    <a href="../index.html" id="back-button">
        <i class="fas fa-arrow-left"></i>
        العودة للرئيسية
    </a>

    <!-- Information Panel -->
    <div id="info">
        <h1>
            <i class="fas fa-cube icon" aria-hidden="true"></i>
            تجربة 3D تفاعلية
        </h1>
        <p>
            <i class="fas fa-mouse icon" aria-hidden="true"></i>
            حرك الفأرة لتدوير الكوب
        </p>
        <p>
            <i class="fas fa-circle-notch icon" aria-hidden="true"></i>
            استخدم العجلة للتكبير والتصغير
        </p>
        <p>
            <i class="fas fa-hand-pointer icon" aria-hidden="true"></i>
            انقر واسحب على الشاشات اللمسية
        </p>
    </div>

    <!-- Controls Panel -->
    <div id="controls">
        <button id="pause-btn" aria-label="Pause Animation">
            <i class="fas fa-pause"></i>
            إيقاف مؤقت
        </button>
        <button id="reset-btn" aria-label="Reset Camera">
            <i class="fas fa-redo"></i>
            إعادة تعيين
        </button>
        <button id="wireframe-btn" aria-label="Toggle Wireframe">
            <i class="fas fa-project-diagram"></i>
            إطار سلكي
        </button>
    </div>

    <!-- Stats Panel -->
    <div id="stats">
        <div class="stat-item">FPS: <span class="stat-value">60</span></div>
        <div class="stat-item">Vertices: <span class="stat-value">0</span></div>
        <div class="stat-item">Camera Z: <span class="stat-value">5.00</span></div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Scene Script -->
    <script src="js/scene.js"></script>
</body>
</html>
